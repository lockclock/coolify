# documentation: https://docs.litespeedtech.com/cloud/images/ols-docker
# slogan: WordPress powered by OpenLiteSpeed and MariaDB for high-performance PHP hosting
# category: cms
# tags: cms, wordpress, openlitespeed, php, mariadb
# logo: svgs/wordpress-openlitespeed.svg
# port: 80

services:
  wordpress:
    image: litespeedtech/openlitespeed:latest
    volumes:
      - wordpress-files:/var/www/vhosts/localhost/html
    environment:
      - SERVICE_URL_WORDPRESS_OLS
      - OLS_ADMIN_USER=$SERVICE_USER_OLS_ADMIN
      - OLS_ADMIN_PASSWORD=$SERVICE_PASSWORD_OLS_ADMIN
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=wordpress
    depends_on:
      - mariadb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 2s
      timeout: 10s
      retries: 10

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=$SERVICE_USER_WORDPRESS
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  wordpress-files:
  mariadb-data:
  wordpress-files:
  mariadb-data:
